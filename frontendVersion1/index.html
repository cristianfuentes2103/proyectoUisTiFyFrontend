<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icons/YetiIcon.svg" type="image/x-icon">
    <title>UistiFy</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container">

        <!-- Vista para Login y Registro -->
        <div id="auth-view" class="view">
            <!-- Contenedor para el LOGO de UisTiFy-->
            <div class="logo-container" title="Logo de UistiFy">
                <img src="img/UisTiFy.png" alt="Logo de UistiFy">
            </div>
            <!-- Contenedor para el Formulario de Login y Registro-->
            <div class="form-container">
                <!-- Contenedor para la mascota de UistiFy -->
                <div class="yeti-container">

                    <svg version="1.2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048">
                        <title>mascotaUisTiFy</title>
                        <use id="Background" href="#img1" x="312" y="250" />
                        <g id="eyes">
                            <!-- Ojo Izquierdo -->
                            <g id="eye-left">
                                <!--Circulo del ojo-->
                                <circle cx="630" cy="1000" r="100" fill="white" />
                                <!-- Esclerótica -->
                                <circle cx="630" cy="1000" r="90" fill="#AED6F1" /> <!-- Iris azul -->
                                <circle id="pupil-left" cx="630" cy="1000" r="50" fill="#2C3E50" /> <!-- Pupila -->
                                <circle cx="590" cy="960" r="30" fill="white" /> <!-- Brillo -->
                            </g>
                            <!-- Ojo Derecho -->
                            <g id="eye-right">
                                <circle cx="970" cy="1030" r="100" fill="white" />
                                <!-- Esclerótica -->
                                <circle cx="970" cy="1030" r="90" fill="#AED6F1" /> <!-- Iris azul -->
                                <circle id="pupil-right" cx="970" cy="1030" r="50" fill="#2C3E50" /> <!-- Pupila -->
                                <circle cx="930" cy="980" r="30" fill="white" /> <!-- Brillo -->
                            </g>
                        </g>
                    </svg>
                </div>

                <!-- ######### Formulario de Login ########## -->
                <form id="login-form" alt="Formulario de Login">
                    <h2>Iniciar Sesión</h2>
                    <input type="email" id="login-email" placeholder="Correo electrónico" required>
                    <input type="password" id="login-password" placeholder="Contraseña" required>
                    <button class="button" type="submit">
                        Ingresar a UisTiFy
                        <svg fill="currentColor" viewBox="0 0 24 24" class="icon">
                            <path clip-rule="evenodd"
                                d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm4.28 10.28a.75.75 0 000-1.06l-3-3a.75.75 0 10-1.06 1.06l1.72 1.72H8.25a.75.75 0 000 1.5h5.69l-1.72 1.72a.75.75 0 101.06 1.06l3-3z"
                                fill-rule="evenodd">
                            </path>
                        </svg>
                    </button>
                </form>

                <!-- ######### Formulario de Registro (Estado Inicial Oculto) #########  -->
                <form id="register-form" class="hidden">
                    <h2>Crear Cuenta</h2>
                    <input type="name" id="register-name" placeholder="Nombre" required>
                    <input type="email" id="register-email" placeholder="Correo electrónico" required>
                    <input type="password" id="register-password" placeholder="Contraseña" required>
                    <button class="button" type="submit">
                        Registrarse
                        <svg fill="currentColor" viewBox="0 0 24 24" class="icon">
                            <path clip-rule="evenodd"
                                d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm4.28 10.28a.75.75 0 000-1.06l-3-3a.75.75 0 10-1.06 1.06l1.72 1.72H8.25a.75.75 0 000 1.5h5.69l-1.72 1.72a.75.75 0 101.06 1.06l3-3z"
                                fill-rule="evenodd">
                            </path>
                        </svg>
                    </button>
                </form>

                <!-- Enlaces para alternar entre formularios de login y registro -->
                <div class="toggle-container">
                    <a href="#" id="show-register-link">¿No tienes cuenta? Regístrate</a>
                    <a href="#" id="show-login-link" class="hidden">¿Ya tienes cuenta? Inicia sesión</a>
                </div>

                <p id="error-message" class="error"></p>

                <div class="main-header-auth">
                    <div class="navigation-arrows-auth">
                        <button title="Regresar a Home" class="auth-btn" id="back-to-home-btn">
                            <i class="icon-arrow-left-auth"></i>Home
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ######### Vista principal de la aplicación (Main View) Oculta inicialmente ######### -->
    <div id="main-view" class="view hidden">
        <!-- 1. BARRA LATERAL (SIDEBAR) -->
        <aside class="sidebar">
            <!-- Bloque 1: Autenticación -->
            <div class="sidebar-block user-auth empty">
                <!-- Contenido para usuarios no logueados -->
                <div class="auth-buttons" id="sidebar-auth-content">
                    <button id="go-to-login-btn" class="btn btn-primary">Iniciar Sesión</button>
                    <button id="go-to-register-btn" class="btn btn-secondary">Registrarse</button>
                </div>
            </div>

            <!--Bloque 2: Navegación (Siempre visible) -->
            <nav class="sidebar-block main-nav">
                <a href="#" class="nav-item">
                    <i class="icon-home"></i> <span>Home</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="icon-search"></i> <span>Buscar</span>
                </a>
            </nav>

            <!-- Bloque 3: Biblioteca (el contenido cambia) -->
            <div class="sidebar-block user-playlists">
                <!-- Cotenido para usuarios logueados (inicialmente oculto) -->
                <div id="sidebar-library-content" class="hidden">
                    <div class="library-header">
                        <i class="icon-library"></i> <span class="library-title">Tu biblioteca</span>
                        <button id="create-playlist-btn" class="btn-create btn-icon">
                            <svg width="22" height="21" viewBox="0 0 24 23" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M12.2841 -0.00683594V23.0001" stroke="#626262" stroke-width="3" />
                                <path d="M0 11.6562H24" stroke="#626262" stroke-width="3" />
                            </svg>Crear lista
                        </button>
                    </div>
                    <div id="playlist-container">
                        <!-- Las playlists se cargan aquí -->
                    </div>
                </div>
                <!-- Los usuarios no logueaedos simplemente verán este bloque vacío -->
            </div>
        </aside>

        <!-- 2. CONTENIDO PRINCIPAL -->
        <div class="main-content">
            <!-- Cabecera Principal para Botón de Cerrar Sesión-->
            <header class="main-header">
                <div id="user-profile-menu" class="user-profile-menu hidden">
                    <button id="user-avatar-btn" class="user-avatar-btn">
                        <i class="icon-yeti-cs" alt="Cerrar Sesión"></i>
                    </button>
                    <div id="logout-dropdown" class="logout-dropdown hidden">
                        <button id="logout-btn" class="logout-btn">Cerrar Sesión</button>
                    </div>
                </div>
            </header>
            <main id="home-view-content" class="content-area">
                <h1 class="welcome-message">Bienvenido, Buenos días</h1>
                <!-- Acá se cargan los Álbumes-->
            </main>
        </div>

        <!-- 3. REPRODUCTOR DE MÚSICA -->
        <footer class="player-bar">
            <div class="player-controls">
                <button class="player-btn">
                    <i class="icon-play"></i>
                </button>
            </div>
            <div class="progress-bar">
                <span>00:00</span>
                <div class="progress-line"></div>
                <span>4:00</span>
            </div>

        </footer>
    </div>

    <footer id="main-footer" class="footer">
        <p>
            © 2025 UisTify Todos los derechos reservados.
        </p>
    </footer>
    <script type="module" src="js/main.js"></script>
</body>

</html>
